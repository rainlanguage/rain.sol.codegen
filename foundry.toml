[package]
name = "rain-sol-codegen"
version = "0.1.17"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

evm_version = "cancun"

# No cheatcode in forge-std 1.16.1 creates a symlink, so the tests that pin what
# this library does when it finds one at a generated path build it with `ln`.
ffi = true

fs_permissions = [
  # The published interfaces' documentation is asserted against the artifacts
  # solc emits for them, which is the form a consumer receives it in.
  { access = "read", path = "out" },
  { access = "read", path = "foundry.toml" },
  { access = "read-write", path = "src/generated" },
  { access = "read-write", path = "meta" },
]

# `LibCodeGen`'s wrap arithmetic is computed against these, so they are stated
# here rather than inherited from whatever the formatter currently defaults to.
[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false
