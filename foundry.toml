[package]
name = "rain-sol-codegen"
version = "0.1.13"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

evm_version = "cancun"

fs_permissions = [
  { access = "read", path = "foundry.toml" },
  { access = "read-write", path = "src/generated" },
  { access = "read-write", path = "meta" },
]

# `buildFileForContract` unlinks whatever is at the path before it writes, so a
# symlink there is replaced rather than written through to its target. forge-std
# 1.16.1 can read a link (`readLink`) but cannot create one, so a test can only
# set up that precondition by shelling out. This grant is repo wide: every test
# and script here can run arbitrary commands.
ffi = true

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false
