[package]
name = "rain-sol-codegen"
version = "0.1.13"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"

# The generated sources under `src/generated/` pin a bytecode hash produced under
# these settings, and `build-pointers.yaml` regenerates and fails on drift, so
# changing them changes the committed output.
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

evm_version = "cancun"

fs_permissions = [
  { access = "read", path = "foundry.toml" },
  { access = "read-write", path = "src/generated" },
  { access = "read-write", path = "meta" },
]

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false
